# phosphor-fan-control has no ordering of its own, so it starts long before
# dbus-sensors' fansensor publishes the /xyz/openbmc_project/control/fanpwm/*
# objects it drives -- on this board 55s versus 106s. It does not wait: the
# first lookup throws an uncaught DBus exception and the daemon exits 1, twice,
# before systemd's restart finally lands after fansensor is up.
#
# Ordering after fansensor removes the guaranteed mismatch. Service start still
# does not guarantee the objects are published, but phosphor-fan's own "No
# service ... Retrying" path covers the remaining seconds.
[Unit]
After=xyz.openbmc_project.fansensor.service
Wants=xyz.openbmc_project.fansensor.service
